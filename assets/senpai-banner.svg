<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0221"/>
      <stop offset="50%" stop-color="#190a3a"/>
      <stop offset="100%" stop-color="#2a0e4d"/>
    </linearGradient>
    <linearGradient id="grid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6ec7" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff6ec7" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7d6"/>
      <stop offset="70%" stop-color="#ffe08a"/>
      <stop offset="100%" stop-color="#ffb84d"/>
    </radialGradient>
    <linearGradient id="neonText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6ec7"/>
      <stop offset="50%" stop-color="#b06bff"/>
      <stop offset="100%" stop-color="#5ad1ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="260" fill="url(#bg)"/>

  <!-- moon -->
  <circle cx="760" cy="70" r="46" fill="url(#moon)" opacity="0.9"/>
  <circle cx="745" cy="58" r="6" fill="#f2c14e" opacity="0.5"/>
  <circle cx="775" cy="82" r="4" fill="#f2c14e" opacity="0.4"/>

  <!-- distant skyline silhouettes -->
  <g fill="#1a0b33" opacity="0.9">
    <rect x="0" y="190" width="40" height="70"/>
    <rect x="45" y="160" width="30" height="100"/>
    <rect x="80" y="200" width="50" height="60"/>
    <rect x="640" y="175" width="35" height="85"/>
    <rect x="680" y="150" width="25" height="110"/>
    <rect x="715" y="195" width="45" height="65"/>
    <rect x="820" y="170" width="30" height="90"/>
    <rect x="855" y="200" width="45" height="60"/>
  </g>

  <!-- grid floor -->
  <rect x="0" y="200" width="900" height="60" fill="url(#grid)"/>
  <g stroke="#ff6ec7" stroke-opacity="0.5" stroke-width="1">
    <line x1="0" y1="215" x2="900" y2="215"/>
    <line x1="0" y1="232" x2="900" y2="232"/>
    <line x1="0" y1="250" x2="900" y2="250"/>
  </g>

  <!-- sakura petals -->
  <g fill="#ff9ecb" opacity="0.8">
    <ellipse cx="120" cy="60" rx="6" ry="3" transform="rotate(30 120 60)"/>
    <ellipse cx="200" cy="110" rx="5" ry="2.5" transform="rotate(-20 200 110)"/>
    <ellipse cx="300" cy="45" rx="6" ry="3" transform="rotate(60 300 45)"/>
    <ellipse cx="600" cy="130" rx="5" ry="2.5" transform="rotate(10 600 130)"/>
    <ellipse cx="500" cy="70" rx="6" ry="3" transform="rotate(-45 500 70)"/>
    <ellipse cx="820" cy="140" rx="5" ry="2.5" transform="rotate(25 820 140)"/>
  </g>

  <!-- lone silhouette figure (original, generic) -->
  <g fill="#0d0221" opacity="0.95">
    <path d="M 165 260 L 165 205 Q 165 190 178 188 L 178 175 Q 178 160 190 160 Q 202 160 202 175 L 202 188 Q 215 190 215 205 L 215 260 Z"/>
    <!-- flowing cape -->
    <path d="M 178 188 Q 150 210 140 260 L 165 260 L 178 205 Z" opacity="0.85"/>
    <path d="M 202 188 Q 235 205 245 260 L 215 260 L 202 205 Z" opacity="0.85"/>
  </g>

  <!-- kanji + text -->
  <text x="450" y="150" text-anchor="middle" font-family="'Noto Sans JP','Segoe UI',sans-serif" font-size="26" fill="#ffe08a" opacity="0.85">先輩</text>

  <text x="450" y="205" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="58" font-weight="800" letter-spacing="6" fill="url(#neonText)" filter="url(#glow)">SENPAI</text>

  <text x="450" y="228" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="15" letter-spacing="3" fill="#c9b8ff" opacity="0.9">ALI'S DEV CORNER</text>
</svg>
